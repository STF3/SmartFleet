#version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: smartfleet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  mongodb:
    image: mongo:6.0
    container_name: smartfleet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  fleet-service:
    build:
      context: ./fleet-service
    container_name: fleet-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/fleetdb
    depends_on:
      - mongodb
volumes:
  mysql_data:
  mongo_data:
