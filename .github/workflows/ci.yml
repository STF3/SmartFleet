name: SmartFleet CI

on:
  push:
    branches: [ main, develop, STF-* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: authdb
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..20}; do
            nc -z 127.0.0.1 3306 && echo "✅ MySQL is up!" && break
            echo "⏳ Waiting for MySQL..."
            sleep 3
          done

      - name: Build and test auth-service
        run: |
          chmod +x gradlew
          ./gradlew :auth-service:clean :auth-service:test --no-daemon

      - name: Upload test reports (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: auth-service/build/reports/tests/test
